<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado de Cafeteras — Panel de Gestión</title>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="description" content="Sistema de gestión integral para Mercado de Cafeteras. Controla reparaciones, stock e inventario de las sucursales Lanús y Belgrano." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/global.css" />
  <link rel="stylesheet" href="src/styles/cashClose.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" style="display:none;">
      <div class="sidebar-logo">
        <div class="logo-icon">☕</div>
        <div class="logo-text">
          <span class="logo-title">Mercado de</span>
          <span class="logo-subtitle">Cafeteras</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" id="nav-dashboard" onclick="navigate('dashboard')">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
          <span class="nav-badge" id="badge-dashboard"></span>
        </button>
        <button class="nav-btn" id="nav-repairs" onclick="navigate('repairs')">
          <span class="nav-icon">🔧</span>
          <span class="nav-label">Reparaciones</span>
          <span class="nav-badge active" id="badge-repairs">5</span>
        </button>
        <button class="nav-btn" id="nav-stock" onclick="navigate('stock')">
          <span class="nav-icon">📦</span>
          <span class="nav-label">Stock</span>
          <span class="nav-badge alert" id="badge-stock">3</span>
        </button>
        <button class="nav-btn" id="nav-sales" onclick="navigate('sales')">
          <span class="nav-icon">💰</span>
          <span class="nav-label">Ventas</span>
          <span class="nav-badge"></span>
        </button>

        <button class="nav-btn" id="nav-transfers" onclick="navigate('transfers')">
          <span class="nav-icon">🚚</span>
          <span class="nav-label">Traslados</span>
          <span class="nav-badge" id="badge-transfers"></span>
        </button>
        <button class="nav-btn" id="nav-history" onclick="navigate('history')">
          <span class="nav-icon">📜</span>
          <span class="nav-label">Historial</span>
        </button>
        <button class="nav-btn" id="nav-cierre" onclick="openCierre(currentUser && currentUser.location)">
          <span class="nav-icon">🔒</span>
          <span class="nav-label">Cierre de Caja</span>
        </button>
      </nav>

      <div class="sidebar-branches">
        <div class="branches-label">Sucursal activa</div>
        <div class="branch-selector">
          <button class="branch-btn active" id="branch-lanus" onclick="setBranch('lanus')">Lanús</button>
          <button class="branch-btn" id="branch-belgrano" onclick="setBranch('belgrano')">Belgrano</button>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-avatar" id="user-avatar-tag">?</div>
        <div class="user-info">
          <span class="user-name" id="user-name-display">Cargando...</span>
          <span class="user-role" id="user-role-display">...</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="toggleSidebar()" id="menu-toggle">☰</button>
          <div class="page-title-wrap">
            <h1 class="page-title" id="page-title">Bienvenido</h1>
            <span class="page-subtitle" id="page-subtitle">Mercado de Cafeteras</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="topbar-date" id="topbar-date"></div>
          <div class="notification-bell" onclick="toggleNotifications()" id="notif-bell">
            🔔
            <span class="notif-dot"></span>
          </div>
          <div class="notif-dropdown hidden" id="notif-dropdown">
            <div class="notif-header">Alertas</div>
            <div class="notif-item urgent">⚠️ Stock crítico: Cápsulas Nespresso (Lanús)</div>
            <div class="notif-item urgent">⚠️ Stock crítico: Filtros de papel (Belgrano)</div>
            <div class="notif-item">🔧 Reparación #027 lista para entregar</div>
            <div class="notif-item">🔧 Reparación #031 lista para entregar</div>
          </div>
          <button class="btn btn-ghost" onclick="logout()" style="font-size:11px;padding:6px 12px;gap:5px;margin-left:8px;">
            🚪 Salir
          </button>
        </div>
      </header>

      <!-- Page Views -->
      <div id="view-dashboard" class="view active"></div>
      <div id="view-repairs" class="view"></div>
      <div id="view-stock" class="view"></div>
      <div id="view-sales" class="view"></div>
      <div id="view-history" class="view"></div>
      <div id="view-transfers" class="view"></div>
    </main>
  </div>

  <!-- Conexión Database -->
  <script src="src/data/supabaseClient.js"></script>
  <script src="src/data/mockData.js"></script>
  <script src="src/components/login.js"></script>
  <script src="src/components/dashboard.js"></script>
  <script src="src/components/repairs.js"></script>
  <script src="src/components/stock.js"></script>
  <script src="src/components/transfers.js"></script>
  <script src="src/components/sales.js"></script>
  <script src="src/components/cashClose.js"></script>
  <script src="src/components/admissionReceipt.js"></script>
  <script src="src/components/history.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
